name: zerotrust-vaultwarden

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "https://localhost:2080"
    volumes:
      - ./vw-data/:/data/

  caddy:
    image: caddy:latest
    container_name: caddy-reverse-proxy-vaultwarden
    restart: unless-stopped
    depends_on:
      - vaultwarden
    ports:
      - "127.0.0.1:2080:2080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: